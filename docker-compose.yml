# Docker Compose — runs both the FastAPI backend and Next.js frontend.
# Usage:
#   1. Add your OpenRouter API key to backend/.env
#   2. Run: docker compose up --build
#   3. Open: http://localhost:3000

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
